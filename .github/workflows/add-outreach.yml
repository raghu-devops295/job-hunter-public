# Button: adds cover letter + email draft + "why I fit" to job issues created before that feature existed.
name: Add cover letters to old issues

on:
  workflow_dispatch:

env:
  DATA_REPO: raghu-devops295/job-hunter

permissions:
  contents: read

jobs:
  outreach:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Get your private data (resume, facts)
        uses: ./.github/actions/private-data
        with:
          repo: ${{ env.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore robot memory (full job texts)
        uses: actions/cache/restore@v4
        with:
          path: data
          key: jobhunter-data-none
          restore-keys: jobhunter-data-
      - name: Add drafts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          python tools/add_outreach.py > out.txt 2>&1; status=$?
          python tools/save_log.py out.txt add-outreach
          echo "Finished with exit code $status (details: logs/add-outreach/<date>.txt in the private repo)."
          exit $status
