# INDIA run - separate from the Europe run (job-hunter.yml). Creates issues labelled `india` only.
name: India job hunter

on:
  # schedule paused (cost saving). Re-add:  schedule: [{cron: "30 3 * * *"}]  (09:00 IST daily)
  workflow_dispatch: {}

env:
  DATA_REPO: raghu-devops295/job-hunter

permissions:
  contents: read

jobs:
  india:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Get your private data (resume, facts)
        uses: ./.github/actions/private-data
        with:
          repo: ${{ env.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the India search
        env:
          GITHUB_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          python -m jobhunter.india.india_hunter > out.txt 2>&1; status=$?
          python tools/save_log.py out.txt india-hunter
          echo "Finished with exit code $status (details: logs/india-hunter/<date>.txt in the private repo)."
          exit $status
