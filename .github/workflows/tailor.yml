# Add the label "tailor" to a job issue in the PRIVATE repo -> its small "Relay" workflow starts this one
# -> a tailored resume PDF is saved in the private repo's resumes/ and linked on the issue.
# (You can also run it by hand: Actions -> Tailor resume -> Run workflow -> issue number.)

name: Tailor resume

on:
  workflow_dispatch:
    inputs:
      issue:
        description: "Job issue number in the private repo"
        required: true

env:
  DATA_REPO: raghu-devops295/job-hunter

permissions:
  contents: read

concurrency:
  group: tailor-${{ inputs.issue }}   # one run per issue; different issues run side by side
  cancel-in-progress: false

jobs:
  tailor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Get your private data (resume, facts)
        uses: ./.github/actions/private-data
        with:
          repo: ${{ env.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # read-only: get the robot's memory (it holds the full job text for each issue)
      - name: Restore robot memory
        uses: actions/cache/restore@v4
        with:
          path: data
          key: jobhunter-data-none
          restore-keys: jobhunter-data-

      - name: Tailor the resume (PDF goes to the private repo)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}       # optional fallback when Gemini is busy
          GITHUB_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          ISSUE: ${{ inputs.issue }}
          PYTHONUNBUFFERED: "1"
        run: |
          set +e
          [[ "$ISSUE" =~ ^[0-9]+$ ]] || { echo "Issue must be a number"; exit 1; }
          python tailor.py --issue "$ISSUE" > tailor-output.txt 2>&1; status=$?
          python tools/save_log.py tailor-output.txt tailor
          echo "Tailor finished with exit code $status (details: logs/tailor/<date>.txt in the private repo)."
          exit $status
